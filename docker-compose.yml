version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: smartroute
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartroute_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://smartroute:password@db:5432/smartroute_db

volumes:
  postgres_data:
